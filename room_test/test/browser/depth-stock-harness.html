<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Depth Anything stock-image worker harness</title>
<style>body{font:14px system-ui;margin:1rem;background:#101418;color:#e8edf2}canvas{max-width:45vw;max-height:240px;border:1px solid #556}pre{white-space:pre-wrap}</style>
<h1>Depth Anything stock-image worker harness</h1>
<p id="status">Starting…</p>
<canvas id="source"></canvas><canvas id="depth"></canvas>
<pre id="result">RUNNING</pre>
<script type="module">
  // This uses the exact Web Worker and ONNX model shipped by the application.
  // The image is a public Hugging Face documentation stock room photo; no
  // camera, microphone or user image is requested by this regression test.
  const STOCK_ROOM = 'https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/transformers/model_doc/room.jpg';
  const status = document.querySelector('#status');
  const result = document.querySelector('#result');
  const failures = [];
  const check = (value, message) => { if (!value) failures.push(message); };
  const set = message => { status.textContent = message; };
  const heat = t => [Math.round(255*Math.max(0,Math.min(1,1.8-Math.abs(4*t-3)))),Math.round(255*Math.max(0,Math.min(1,1.8-Math.abs(4*t-2)))),Math.round(255*Math.max(0,Math.min(1,1.8-Math.abs(4*t-1))))];
  const drawDepth = d => {
    const c = document.querySelector('#depth'), w = d.rawWidth, h = d.rawHeight;
    c.width = w; c.height = h;
    const finite = Array.from(d.rawDepth).filter(Number.isFinite).sort((a,b)=>a-b);
    const lo = finite[Math.floor(finite.length*.03)], hi = finite[Math.floor(finite.length*.97)];
    const image = c.getContext('2d').createImageData(w,h);
    for (let i=0;i<w*h;i++) { const p=heat((d.rawDepth[i]-lo)/(hi-lo)); image.data.set([p[0],p[1],p[2],255],i*4); }
    c.getContext('2d').putImageData(image,0,0);
  };
  const waitFor = (worker, accept, timeoutMs=180000) => new Promise((resolve,reject) => {
    const timer=setTimeout(()=>{worker.removeEventListener('message',onMessage);reject(new Error(`timeout after ${timeoutMs} ms`));},timeoutMs);
    const onMessage=e=>{ const d=e.data||{}; if(d.type==='deep-download-progress')set(`${d.label}: ${d.pct ?? '?'}%`); if(accept(d)){clearTimeout(timer);worker.removeEventListener('message',onMessage);resolve(d);} };
    worker.addEventListener('message',onMessage);
  });
  try {
    set('Downloading public stock room image…');
    const imageResponse = await fetch(STOCK_ROOM, {cache:'no-store'});
    if (!imageResponse.ok) throw new Error(`stock image HTTP ${imageResponse.status}`);
    const bitmap = await createImageBitmap(await imageResponse.blob());
    const sourceWidth = 320;
    const sourceHeight = Math.max(2, Math.round(sourceWidth * bitmap.height / bitmap.width));
    const canvas = document.querySelector('#source'); canvas.width=sourceWidth; canvas.height=sourceHeight;
    const context=canvas.getContext('2d',{willReadFrequently:true}); context.drawImage(bitmap,0,0,sourceWidth,sourceHeight);
    bitmap.close();
    const rgba=context.getImageData(0,0,sourceWidth,sourceHeight).data;

    const worker = new Worker('../../workers/deep_depth_worker.js', {type:'module'});
    const modelUrl = new URL('../../models/model_q4.onnx', import.meta.url).href;
    const ortUrl = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.all.min.mjs';
    worker.postMessage({type:'init',config:{modelUrl,modelRemoteUrl:null,ortLocal:null,ortRemote:ortUrl,inputMaxSide:518,preferredShortSide:112}});
    await waitFor(worker, d => d.type==='deep-ready', 15000);
    set('Running local Q4 model on the stock room image…');
    worker.postMessage({type:'test',jobId:'stock-room',model:{id:'stock-q4',label:'stock test Q4',url:modelUrl},rgba,width:sourceWidth,height:sourceHeight});
    const output=await waitFor(worker,d=>(d.type==='deep-test-result'||d.type==='deep-error')&&d.jobId==='stock-room');
    worker.terminate();
    if(output.type==='deep-error')throw new Error(output.message||'worker error');
    const expectedShort = 112;
    const finite = Array.from(output.rawDepth).filter(Number.isFinite);
    check(output.preprocessBackend==='manual-rgba-nchw-bilinear','worker did not use the explicit manual NCHW path');
    check(output.inputPlan?.width % 14===0 && output.inputPlan?.height % 14===0,'input dimensions are not ViT-patch multiples');
    check(Math.min(output.inputPlan?.width||0,output.inputPlan?.height||0)===expectedShort,'ultra-light dynamic input did not retain the 112px target axis');
    check(output.rawWidth===output.inputPlan?.width&&output.rawHeight===output.inputPlan?.height,'depth HxW does not match the dynamic model input');
    check(finite.length===output.rawWidth*output.rawHeight,'depth map has non-finite pixels');
    check((output.spatialStats?.directionalRatio||Infinity)<4,'depth map still has a stripe/column signature');
    check((output.spatialStats?.coherenceRatio||0)>1.28,'depth map is spatially incoherent / isotropic-noise-like');
    check(output.inputRasterDiagnostic?.tensorNchwPreview?.length===output.inputPlan.width*output.inputPlan.height*4,'NCHW diagnostic raster is incomplete');
    check(output.testSinglePass===true,'explicit test unexpectedly executed the removed warm benchmark path');
    drawDepth(output);
    const report={provider:output.provider,preprocess:output.preprocessBackend,input:output.inputPlan,output:[output.rawWidth,output.rawHeight],timingMs:output.ms,spatial:output.spatialStats,finite:finite.length,failures};
    document.body.dataset.result=failures.length?'FAIL':'PASS'; result.textContent=JSON.stringify(report,null,2); set(failures.length?'FAIL':'PASS');
  } catch(error) {
    document.body.dataset.result='FAIL'; result.textContent=`FAIL\n${error?.stack||error}`; set('FAIL');
  }
</script>
</html>
