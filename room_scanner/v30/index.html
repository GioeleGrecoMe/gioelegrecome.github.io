<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080b10">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

<style id="deepDiagStyle">
.deepDiagGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;margin-top:.7rem}.deepDiagGrid figure{margin:0;min-width:0}.deepDiagGrid figure[hidden]{display:none}.deepDiagGrid figcaption{font-size:.72rem;opacity:.75;margin:0 0 .25rem}.deepDiagGrid canvas{display:block;width:100%;min-height:100px;background:#05070a;border:1px solid rgba(255,255,255,.15);border-radius:8px;object-fit:contain}.deepDiagReport{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.72rem;line-height:1.35;max-height:none;background:rgba(0,0,0,.28);padding:.65rem;border-radius:8px;margin:.7rem 0 0}@media(max-width:680px){.deepDiagGrid{grid-template-columns:1fr}}

.pipelineTestPanel{margin-top:.7rem}.pipelineTestPanel>summary{cursor:pointer;font-weight:800}.pipelineTestToolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.7rem 0}.pipelineTestSummary{flex:1;min-width:220px;padding:.55rem .65rem;border-radius:8px;background:rgba(255,255,255,.045)}.pipelineTestSummary[data-status=fail]{outline:1px solid rgba(255,100,100,.7)}.pipelineTestSummary[data-status=warn]{outline:1px solid rgba(255,196,82,.6)}.pipelineTestStages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.pipelineTestStage{padding:.65rem;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.025)}.pipelineTestStage.fail{border-color:rgba(255,100,100,.55)}.pipelineTestStage.warn{border-color:rgba(255,196,82,.45)}.pipelineTestStageHead{display:flex;justify-content:space-between;gap:.5rem}.pipelineTestBadge{font-size:.7rem;font-weight:800;opacity:.88}.pipelineTestWhy,.pipelineTestAction{font-size:.78rem;margin-top:.35rem}.pipelineTestAction{opacity:.82}.pipelineTestMetrics{font-size:.68rem;white-space:pre-wrap;max-height:160px;overflow:auto;background:rgba(0,0,0,.2);padding:.45rem;border-radius:7px}.pipelineTestRaw pre{max-height:300px;overflow:auto;font-size:.66rem;white-space:pre-wrap}@media(max-width:760px){.pipelineTestStages{grid-template-columns:1fr}}
</style>

<style id="processingStyle">
.processingScreen{overflow:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:#080b10;color:#fff}.processingHead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;max-width:1180px;margin:0 auto 1rem}.processingHead h2{margin:.3rem 0 0}.processingCounter{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}.processingCard{max-width:1180px;margin:0 auto 1rem;padding:.85rem 1rem;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.045)}.processingStatus{font-weight:700;margin-bottom:.45rem}.processingCard progress{width:100%;height:.8rem}.processingGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem;max-width:1180px;margin:0 auto}.processingGrid figure{margin:0;padding:.65rem;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);min-width:0}.processingGrid figcaption{font-size:.78rem;opacity:.82;margin-bottom:.4rem}.processingGrid canvas{display:block;width:100%;height:auto;min-height:220px;max-height:42vh;object-fit:contain;background:#05070a;border-radius:8px}.processingGrid .processingWorld{grid-column:1/-1}.processingGrid .processingWorld canvas{height:340px;max-height:none}.processingLegend{display:flex;flex-wrap:wrap;gap:.55rem 1.1rem;max-width:1180px;margin:.8rem auto 0;font-size:.76rem;opacity:.86}.processingScreen>.hint{max-width:1180px;margin:.7rem auto 0}@media(max-width:760px){.processingGrid{grid-template-columns:1fr}.processingGrid .processingWorld{grid-column:auto}.processingGrid canvas{min-height:180px}.processingGrid .processingWorld canvas{height:300px}.processingHead{align-items:center}.processingHead h2{font-size:1.2rem}}
</style>
<style id="alvaFeatureStyle">
#alvaFeatureOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}#alvaFeatureState{position:absolute;left:12px;top:max(82px,calc(env(safe-area-inset-top) + 74px));z-index:14;padding:.3rem .5rem;border-radius:999px;background:rgba(3,8,14,.72);border:1px solid rgba(85,220,255,.45);font-size:.72rem;font-weight:700;color:#dff8ff;pointer-events:none}#alvaFeatureState[data-recovery="1"]{border-color:#ff9a52;color:#ffd8bf}.alvaRecoveryBanner{position:absolute;z-index:18;left:50%;top:42%;transform:translate(-50%,-50%);width:min(92vw,650px);padding:1rem 1.15rem;border-radius:14px;background:rgba(78,25,8,.94);border:2px solid #ff9a52;color:#fff;font-weight:800;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);pointer-events:none}.alvaRecoveryBanner[hidden]{display:none}
</style>
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <div class="hero"><div id="buildBadge" class="badge">V30.52.0</div><h1>Room Scanner V30</h1><p>Pin WebXR 3D semplici, calibrazione metrica e scansione camera-only.</p></div>
