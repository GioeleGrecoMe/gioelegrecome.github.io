<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V30.11 diagnostic</title><style>body{font:14px system-ui;background:#081018;color:#eee;padding:20px}pre{white-space:pre-wrap}.ok{color:#5cff8d}.bad{color:#ff7777}button{padding:10px}</style><h1>Room Scanner V30.11.4 diagnostic</h1><button id="reset">Reset cache/SW V30</button><pre id="out">check...</pre><script>
const paths=['room_scanner_v30.html','styles.css','js/boot.js','js/app.js','js/config.js','js/xr/xr_calibration.js','js/xr/metric_bridge.js','workers/gaussian_worker.js','workers/mvs_worker.js','wasm/slam_core.wasm'];
async function probe(path){const c=new AbortController(),timer=setTimeout(()=>c.abort(),1800);try{const r=await fetch(`${path}?diag=${Date.now()}`,{cache:'no-store',signal:c.signal});return {path,ok:r.ok,status:r.status,size:Number(r.headers.get('content-length')||0)}}catch(e){return {path,ok:false,error:e.message}}finally{clearTimeout(timer)}}
(async()=>{const rs=await Promise.all(paths.map(probe));out.textContent=rs.map(x=>`${x.ok?'PASS':'FAIL'} ${x.path}${x.ok?'':` · ${x.status||x.error}`}`).join('\n')})();
reset.onclick=async()=>{for(const r of await navigator.serviceWorker?.getRegistrations?.()||[]){try{if(new URL(r.scope).pathname.includes('/room_scanner/v30/'))await r.unregister()}catch{}}for(const k of await caches.keys())if(k.startsWith('room-scanner-v30'))await caches.delete(k);location.reload()};
</script>
