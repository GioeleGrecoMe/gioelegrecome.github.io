<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090f"><title>Room Scanner · reset cache + diagnostica</title><style>html,body{margin:0;min-height:100%;background:#05090f;color:#edf8ff;font:14px/1.45 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:28px 18px}.box{background:#0b1724;border:1px solid rgba(99,220,255,.35);border-radius:16px;padding:16px}pre{white-space:pre-wrap;word-break:break-word;background:#03070b;padding:12px;border-radius:10px;color:#bfeeff}button{padding:11px 14px;border:0;border-radius:10px;background:#63dcff;color:#04131b;font-weight:800}</style></head><body><main><div class="box"><h1>Room Scanner · diagnostica pulita</h1><p>Questa pagina elimina le cache Room Scanner, sostituisce temporaneamente il Service Worker con quello diagnostico e apre la build <b>attualmente pubblicata</b> senza cache.</p><pre id="log">Avvio…</pre><button id="again" hidden>Riprova</button></div></main><script>
(async()=>{const log=document.getElementById('log'),say=s=>{log.textContent+=`\n${s}`};try{const old=await navigator.serviceWorker?.getRegistrations?.()||[];say(`Service Worker trovati: ${old.length}`);for(const r of old){say(`unregister ${r.active?.scriptURL||r.scope}`);await r.unregister()}const names=await caches.keys();let removed=0;for(const n of names){if(/room|scanner|acoustic|semantic|depth|951|mobile.?sam|onnx|ort/i.test(n)){await caches.delete(n);removed++;say(`cache rimossa: ${n}`)}}say(`Cache Room Scanner rimosse: ${removed}`);const sid='diag-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);sessionStorage.setItem('roomScannerDiagSessionId',sid);localStorage.setItem('roomScannerDiagSessionId',sid);const reg=await navigator.serviceWorker.register(`./room_scanner_diag_sw.js?v=20260815-3`,{scope:'./',updateViaCache:'none'});say(`SW diagnostico registrato: ${reg.scope}`);await reg.update();if(!navigator.serviceWorker.controller){say('Attendo controllo del nuovo Service Worker…');await new Promise((resolve,reject)=>{const to=setTimeout(()=>reject(new Error('controllerchange timeout')),10000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(to);resolve()},{once:true});reg.active?.postMessage?.({type:'claim'})}).catch(()=>{})}say(`Sessione diagnostica: ${sid}`);say('Apro Room Scanner network-only…');location.replace(`./room_scanner_v9.html?rsdiag=${encodeURIComponent(sid)}&cb=${Date.now()}`)}catch(e){say(`ERRORE: ${e.stack||e}`);document.getElementById('again').hidden=false;document.getElementById('again').onclick=()=>location.reload()}})();
</script></body></html>
