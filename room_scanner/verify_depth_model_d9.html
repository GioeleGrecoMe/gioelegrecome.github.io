<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depth Model D9 Verifier</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#111;color:#eee}h1{font-size:20px}#badge{padding:10px;background:#ffd54a;color:#111;font-weight:800;border-radius:8px;margin-bottom:12px}button{padding:12px 16px;font-size:16px}pre{white-space:pre-wrap;word-break:break-word;background:#1d1d1d;padding:12px;border-radius:8px;min-height:220px}.ok{color:#79e27d}.bad{color:#ff8585}
</style>
</head>
<body>
<div id="badge">ROOM SCANNER V11-D9 · LOCAL MODEL VERIFIER</div>
<h1>Verifica depth_anything_v2_small_q4f16.onnx</h1>
<p>Controlla esclusivamente il file locale piatto. Non avvia WebXR o ONNX Runtime.</p>
<button id="run">VERIFICA MODELLO</button>
<pre id="out">Pronto.</pre>
<script>
(function(){
'use strict';
const EXPECTED_BYTES=19126267;
const EXPECTED_SHA='eca72971aea64216d767c70c534160de53b5435b588d362bac6dbd5a73f9bf1e';
const out=document.getElementById('out');
const btn=document.getElementById('run');
function line(s){out.textContent += '\n'+s; out.scrollTop=out.scrollHeight;}
function hex(buf){return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');}
async function run(){
 btn.disabled=true; out.textContent='D9 verifier avviato';
 const url=new URL('./depth_anything_v2_small_q4f16.onnx',location.href); url.searchParams.set('verify',Date.now());
 line('URL: '+url.href);
 const ac=new AbortController(); const hard=setTimeout(()=>ac.abort('timeout 90s'),90000);
 try{
  const t0=performance.now();
  const r=await fetch(url.href,{cache:'no-store',credentials:'same-origin',signal:ac.signal});
  line('HTTP: '+r.status+' '+r.statusText);
  line('Content-Type: '+(r.headers.get('content-type')||'(assente)'));
  line('Content-Length: '+(r.headers.get('content-length')||'(assente)'));
  if(!r.ok) throw new Error('HTTP '+r.status);
  let received=0,buffer;
  if(r.body&&r.body.getReader){
   const merged=new Uint8Array(EXPECTED_BYTES); const reader=r.body.getReader();
   let lastPct=-1;
   while(true){
    const q=await reader.read(); if(q.done)break;
    if(q.value&&q.value.byteLength){
     if(received+q.value.byteLength>EXPECTED_BYTES)throw new Error('file più grande del previsto');
     merged.set(q.value,received); received+=q.value.byteLength;
     const pct=Math.floor(received*100/EXPECTED_BYTES);
     if(pct>=lastPct+5||pct===100){lastPct=pct;line('Download: '+pct+'% · '+received+' / '+EXPECTED_BYTES+' byte');}
    }
   }
   buffer=received===EXPECTED_BYTES?merged.buffer:merged.slice(0,received).buffer;
  }else{buffer=await r.arrayBuffer();received=buffer.byteLength;line('Download non-streaming: '+received+' byte');}
  line('Byte finali: '+buffer.byteLength);
  if(buffer.byteLength!==EXPECTED_BYTES)throw new Error('dimensione errata: '+buffer.byteLength+' != '+EXPECTED_BYTES);
  line('Calcolo SHA-256...');
  const digest=hex(await crypto.subtle.digest('SHA-256',buffer));
  line('SHA-256: '+digest);
  if(digest!==EXPECTED_SHA)throw new Error('SHA-256 errato');
  line('OK: MODELLO LOCALE CORRETTO E COMPLETAMENTE SCARICABILE');
  line('Tempo totale: '+Math.round(performance.now()-t0)+' ms');
  out.className='ok';
 }catch(e){line('ERRORE: '+String(e&&e.stack||e));out.className='bad';}
 finally{clearTimeout(hard);btn.disabled=false;}
}
btn.addEventListener('click',run);
run();
})();
</script>
</body>
</html>
