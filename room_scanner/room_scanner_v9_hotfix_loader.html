<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Room Scanner v9 · hotfix loader</title>
  <script src="./room_scanner_source_transformer.js?v=20260815-3"></script>
  <style>
    html,body{height:100%;margin:0;background:#080b11;color:#f4f7fb;font-family:system-ui,sans-serif}
    main{max-width:780px;margin:auto;padding:28px}
    code{word-break:break-all}
    pre{white-space:pre-wrap;background:#111722;padding:12px;border-radius:10px}
  </style>
</head>
<body>
<main>
  <h1>Room Scanner v9 · hotfix</h1>
  <p id="status">Caricamento del file originale e applicazione hotfix…</p>
  <pre id="detail"></pre>
</main>
<script>
(async function bootstrapPatchedRoomScanner(){
  'use strict';
  const BUILD = '20260815-3';
  const TARGET = new URL('./room_scanner_v9.html', location.href).href;
  const status = document.getElementById('status');
  const detail = document.getElementById('detail');

  function setStatus(text, extra='') {
    status.textContent = text;
    detail.textContent = extra;
  }

  function makeScriptTag(jsText) {
    // IMPORTANT: split the closing tag in the LOADER source so the HTML parser
    // does not terminate this loader script early. The returned string contains
    // a real closing SCRIPT tag, not the escaped text emitted by the first hotfix.
    return '<scr' + 'ipt>' + jsText + '</scr' + 'ipt>';
  }

  function makeExternalScriptTag(src) {
    return '<scr' + 'ipt src="' + src + '"></scr' + 'ipt>';
  }

  function preflightHtml(html) {
    // Parse an inert copy before document.write. This catches exactly the class
    // of malformed-tag regression that caused the blank page in hotfix v1.
    const probe = new DOMParser().parseFromString(html, 'text/html');
    if (!probe || !probe.documentElement || !probe.body) {
      throw new Error('Preflight HTML fallito: documento non parsabile.');
    }
    const rawBody = String(probe.body.textContent || '').trim();
    const elementCount = probe.body.querySelectorAll('*').length;
    if (!rawBody && elementCount === 0) {
      throw new Error('Preflight HTML fallito: body vuoto dopo la patch.');
    }
    return { elementCount, scriptCount: probe.querySelectorAll('script').length };
  }

  try {
    const response = await fetch(TARGET, { cache:'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status} su ${TARGET}`);
    let html = await response.text();
    if (!html || html.length < 200) throw new Error('room_scanner_v9.html vuoto o incompleto.');

    if (!window.RoomScannerSourceTransformer || typeof window.RoomScannerSourceTransformer.transformHtml !== 'function') {
      throw new Error('room_scanner_source_transformer.js non caricato.');
    }

    // Conservative v2 transformer: patches only classic inline JS gate blocks
    // and reverts each script automatically if syntax validation fails.
    const transformed = window.RoomScannerSourceTransformer.transformHtml(html);
    html = transformed.html;

    const earlyJs = [
      'window.__RS_HOTFIX_SOURCE_PATCHED__=true;',
      'try{window.__RS_ALLOW_UNCALIBRATED__=localStorage.getItem("roomScanner.hotfix.allowUncalibrated")==="1";}',
      'catch(_){window.__RS_ALLOW_UNCALIBRATED__=false;}'
    ].join('');
    const earlyBoot = makeScriptTag(earlyJs);

    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head([^>]*)>/i, `<head$1>${earlyBoot}`);
    } else {
      html = earlyBoot + html;
    }

    // Keep the runtime external. This avoids escaping its contents and removes
    // an entire failure mode from the first loader implementation.
    const runtimeTag = makeExternalScriptTag(`./room_scanner_hotfix.js?v=${BUILD}`);
    html = /<\/body>/i.test(html)
      ? html.replace(/<\/body>/i, `${runtimeTag}</body>`)
      : html + runtimeTag;

    const probe = preflightHtml(html);
    setStatus(
      'Hotfix verificato. Avvio Room Scanner…',
      `Gate calibrazione riscritti: ${transformed.patchedGuards}\n` +
      `Script lasciati originali per sicurezza: ${transformed.skippedScripts}\n` +
      `Preflight DOM: ${probe.elementCount} elementi, ${probe.scriptCount} script.`
    );

    // Same top-level document/origin as the original deployment. Relative URLs,
    // camera, microphone and WebXR therefore keep the original path/origin.
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error('[Room Scanner hotfix]', error);
    setStatus(
      'Impossibile avviare il loader hotfix. Il file originale non è stato modificato.',
      `${error && error.stack ? error.stack : error}\n\n` +
      'Verifica che room_scanner_v9.html, room_scanner_v9_hotfix_loader.html, ' +
      'room_scanner_source_transformer.js e room_scanner_hotfix.js siano nella stessa cartella HTTPS.'
    );
  }
})();
</script>
</body>
</html>
